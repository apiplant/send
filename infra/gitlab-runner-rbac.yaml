# RBAC letting GitLab CI deploy jobs apply and restart the send deployment.
#
# The self-hosted GitLab Runner (kubernetes executor, gitlab-runner namespace)
# runs job pods in-cluster. Those pods authenticate to the k3s API with their
# mounted ServiceAccount token (the `default` SA in the gitlab-runner
# namespace), so a deploy job runs `kubectl apply` / `rollout restart` directly
# — no kubeconfig, no GitLab Agent, no exposed :6443.
#
# This grants that SA the minimum needed in the `send` namespace and nothing
# else. Apply once as a cluster admin:
#   KUBECONFIG=~/.kube/oracle-1 kubectl apply -f infra/namespace.yaml -f infra/gitlab-runner-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: send
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update", "create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-deployer
  namespace: send
subjects:
  - kind: ServiceAccount
    name: default
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
